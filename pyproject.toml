[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfectjet"
version = "0.3.0"
description = "Exact representations, populations, closure defects, and arithmetic research atlas"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
perfectjet = "perfectjet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
