name: Discovery engine exact regressions
on:
  pull_request:
    paths:
      - 'src/perfectjet/observation_design.py'
      - 'src/perfectjet/cubic_certificate_search.py'
      - 'tests/test_discovery_engine.py'
      - 'docs/DISCOVERY_ENGINE.md'
      - '.github/workflows/discovery-engine.yml'
  push:
    paths:
      - 'src/perfectjet/observation_design.py'
      - 'src/perfectjet/cubic_certificate_search.py'
      - 'tests/test_discovery_engine.py'
      - 'docs/DISCOVERY_ENGINE.md'
      - '.github/workflows/discovery-engine.yml'
  workflow_dispatch:
jobs:
  exact-discoveries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_discovery_engine.py' -v
