name: Asterion weight-seven cubic certificates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exact-cubic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Independent Bareiss ranks, every projected image and full source null lift
        run: python scripts/verify_asterion_w7_rank_certificates.py --lattice --source-null
      - name: Recompute the seven inherited sectors without relabelling historical receipts
        run: python scripts/replay_asterion_w7_prior_sectors.py --check
      - name: Verify all publication bindings and the sealed evidence inventory
        run: python scripts/verify_asterion_w7_integration.py
      - run: python -m unittest tests.test_weight_seven_integration tests.test_asterion_w7_certificates tests.test_asterion_w7_translation tests.test_asterion_lattice_projection -v
      - name: Verify installed resources outside the checkout
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/w7-wheels .
          python -m venv /tmp/w7-venv
          /tmp/w7-venv/bin/python -m pip install --no-index --no-deps /tmp/w7-wheels/*.whl
          cd /tmp
          /tmp/w7-venv/bin/python -I -m perfectjet.weight_seven
