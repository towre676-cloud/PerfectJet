name: Finalize Asterion cubic provenance and replay
on:
  workflow_dispatch:
  push:
    branches: [codex/asterion-w7-missing-sectors-20261030]
    paths: ['.github/workflows/asterion-w7.yml']
permissions:
  contents: write
  actions: write
  statuses: write
concurrency:
  group: asterion-cubic-integration-finalization
  cancel-in-progress: false
jobs:
  rebuild-and-verify:
    if: github.ref == 'refs/heads/codex/asterion-w7-missing-sectors-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scouting]'
      - name: Rebuild all publication certificates mathematically before rebinding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          python scripts/verify_asterion.py 2>&1 | tee verification/publication.log
          python scripts/verify_asterion_extension.py 2>&1 | tee verification/extension.log
          python scripts/verify_asterion_frontiers.py 2>&1 | tee verification/frontiers.log
      - name: Independently replay exact cubic evidence and source null lift
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_asterion_w7_rank_certificates.py --lattice --source-null 2>&1 | tee verification/completion.log
          python scripts/replay_asterion_w7_prior_sectors.py --check 2>&1 | tee verification/prior-sectors.log
          python scripts/audit_asterion_w7_provenance.py 2>&1 | tee verification/provenance.log
          python scripts/verify_asterion_w7_integration.py --write
          python scripts/verify_asterion_w7_integration.py
      - name: Complete regression suite with strict provenance tests unchanged
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee verification/full-regression.log
          python scripts/check_coverage.py
          python scripts/build_mathlab.py --check
      - name: Verify installed theorem outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir /tmp/w7-wheels .
          python -m venv /tmp/w7-venv
          /tmp/w7-venv/bin/python -m pip install --no-index --no-deps /tmp/w7-wheels/*.whl
          cd /tmp
          /tmp/w7-venv/bin/python -I -m perfectjet.weight_seven
      - name: Preserve verified generated receipts on the PR branch only
        id: preserve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/asterion results/asterion-extension results/asterion-frontiers results/asterion-primitives src/perfectjet/resources/asterion_w7_integration.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Asterion certificates after exhaustive exact replay'
            git push origin HEAD:refs/heads/codex/asterion-w7-missing-sectors-20261030
          fi
          git rev-parse HEAD | tee verification/VERIFIED_COMMIT.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bind successful mathematical verification to the resulting commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ steps.preserve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$VERIFIED_SHA" -f state=success -f context='Asterion exhaustive integration replay' -f description='Exact replays, full regression and isolated installation passed' -f target_url="$RUN_URL"
      - name: Run standard repository checks against the resulting PR commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/dispatches" -f ref='codex/asterion-w7-missing-sectors-20261030'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asterion-cubic-verification-${{ github.run_id }}
          path: |
            verification/
            results/asterion-primitives/w7-provenance-audit.json
            src/perfectjet/resources/asterion_w7_integration.json
