name: Exact mathematics and coverage
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scouting]'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m perfectjet.cli report --output results/replay-ci.json
        env:
          PYTHONPATH: src
      - run: python -m perfectjet.cli math-bridges --output results/math-bridges-ci.json
        env:
          PYTHONPATH: src
      - run: python scripts/check_coverage.py
      - run: python scripts/build_mathlab.py --check
        env:
          PYTHONPATH: src
      - run: python scripts/verify_asterion.py --check
        env:
          PYTHONPATH: src
      - run: python scripts/verify_asterion_extension.py --check
        env:
          PYTHONPATH: src
      - run: python scripts/verify_dell.py --check
        env:
          PYTHONPATH: src
      - run: python -m perfectjet.cli math-lab --all --output results/mathlab/replay-ci.json
        env:
          PYTHONPATH: src
      - run: python scripts/benchmark_observatory.py --output results/observatory/benchmark-ci.json
      - run: python scripts/check_observatory_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: perfectjet-exact-replay
          path: |
            results/replay-ci.json
            results/math-bridges-ci.json
            results/observatory/benchmark-ci.json
            results/mathlab/replay-ci.json
            results/asterion/
            results/asterion-extension/
            results/dell/
