name: Complete weight-seven runtime verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/perfectjet/**'
      - 'scripts/*complete_weight*.py'
      - 'scripts/check_installed_weight_seven.py'
      - 'tests/test_complete_weight_seven*.py'
      - 'tests/test_asterion_lattice_projection4.py'
      - 'research/week-2026-11-05/**'
      - '.github/workflows/complete-weight7-runtime.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.verify_complete_weight_seven --output complete-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-weight7-runtime-replay
          path: complete-replay/
  installed:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "setuptools>=68" wheel
      - run: python scripts/check_installed_weight_seven.py
