name: Verify and publish PerfectJet v0.22.0rc1
on:
  workflow_dispatch:
  push:
    branches: [codex/release-v022rc1]
env:
  # Release source is immutable; workflow repairs must not rebuild a different candidate.
  CANDIDATE_SHA: 452e77c98ad6167b39ae62cd926c776f0dcadf40
permissions:
  contents: read
concurrency:
  group: perfectjet-v022rc1-publication-final
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install setuptools wheel
      - name: Build twice, compare bytes and enforce committed source inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          cp releases/PerfectJet-v0.22.0rc1.zip "$RUNNER_TEMP/first.zip"
          python scripts/build_release.py
          cmp "$RUNNER_TEMP/first.zip" releases/PerfectJet-v0.22.0rc1.zip
          git diff --exit-code -- MANIFEST.json releases/PerfectJet-v0.22.0rc1.zip.sha256
          python scripts/check_release_source.py releases/PerfectJet-v0.22.0rc1.zip
      - name: Verify isolated installation and all source and installed launcher tools
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release.py releases/PerfectJet-v0.22.0rc1.zip --e8-lattice 2>&1 | tee "$RUNNER_TEMP/verify-release.txt"
      - name: Full regression and executable research checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/research-checks.txt") 2>&1
          PS4='+ ${SECONDS}s '
          set -x
          python -m pip install -e '.[scouting]'
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/regressions.txt"
          python scripts/build_collision_catalogue.py --check
          python scripts/verify_collision_pell.py --check
          python independent_checks/collision_pell/verify.py
          python scripts/verify_collision_finite_x.py --check
          python independent_checks/collision_finite_x/verify.py
          node scripts/check_collision_explorer.cjs
          python scripts/build_mathlab.py --check
          python scripts/verify_asterion.py --check
          python scripts/verify_asterion_extension.py --check
          python scripts/verify_asterion_frontiers.py --check
          python scripts/replay_asterion_w7_prior_sectors.py --check
          python scripts/verify_asterion_w7_integration.py
          python scripts/verify_dell.py --check
          python scripts/check_observatory_ui.py
      - name: Stage evidence with a stable flat artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          cp releases/PerfectJet-v0.22.0rc1.zip.sha256 "$RUNNER_TEMP/release-evidence/"
          cp "$RUNNER_TEMP/verify-release.txt" "$RUNNER_TEMP/release-evidence/"
          if [ -f "$RUNNER_TEMP/regressions.txt" ]; then
            cp "$RUNNER_TEMP/regressions.txt" "$RUNNER_TEMP/release-evidence/"
            cp "$RUNNER_TEMP/research-checks.txt" "$RUNNER_TEMP/release-evidence/"
          fi
      - name: Retain platform verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfectjet-v022rc1-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools wheel
      - uses: actions/download-artifact@v4
        with:
          pattern: perfectjet-v022rc1-*-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
      - name: Require matching platform archives and prepare source attestation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          cp releases/PerfectJet-v0.22.0rc1.zip "$RUNNER_TEMP/first.zip"
          python scripts/build_release.py
          cmp "$RUNNER_TEMP/first.zip" releases/PerfectJet-v0.22.0rc1.zip
          git diff --exit-code -- MANIFEST.json releases/PerfectJet-v0.22.0rc1.zip.sha256
          python scripts/check_release_source.py releases/PerfectJet-v0.22.0rc1.zip
          for os in Linux Windows; do
            cmp releases/PerfectJet-v0.22.0rc1.zip.sha256 "$RUNNER_TEMP/evidence/perfectjet-v022rc1-$os-$GITHUB_SHA/PerfectJet-v0.22.0rc1.zip.sha256"
            cp "$RUNNER_TEMP/evidence/perfectjet-v022rc1-$os-$GITHUB_SHA/verify-release.txt" "releases/verification-$os.txt"
          done
          cp "$RUNNER_TEMP/evidence/perfectjet-v022rc1-Linux-$GITHUB_SHA/regressions.txt" releases/regressions.txt
          cp "$RUNNER_TEMP/evidence/perfectjet-v022rc1-Linux-$GITHUB_SHA/research-checks.txt" releases/research-checks.txt
          git rev-parse HEAD > releases/SOURCE_COMMIT.txt
          test "$(cat releases/SOURCE_COMMIT.txt)" = "$CANDIDATE_SHA"
          cp MANIFEST.json docs/INSTALL.md docs/RELEASE-v0.22.0rc1.md releases/
          cd releases
          sha256sum PerfectJet-v0.22.0rc1.zip MANIFEST.json SOURCE_COMMIT.txt INSTALL.md RELEASE-v0.22.0rc1.md verification-Linux.txt verification-Windows.txt regressions.txt research-checks.txt > SHA256SUMS
      - name: Create a new draft without changing historical releases or tags
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.22.0rc1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.22.0rc1 >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to retarget.' >&2
            exit 1
          fi
          gh release create v0.22.0rc1 releases/PerfectJet-v0.22.0rc1.zip releases/PerfectJet-v0.22.0rc1.zip.sha256 releases/MANIFEST.json releases/SOURCE_COMMIT.txt releases/SHA256SUMS releases/INSTALL.md releases/RELEASE-v0.22.0rc1.md releases/verification-Linux.txt releases/verification-Windows.txt releases/regressions.txt releases/research-checks.txt --target "$CANDIDATE_SHA" --draft --prerelease --title 'PerfectJet v0.22.0rc1 — Completed E8 cubic theorem release candidate' --notes-file docs/RELEASE-v0.22.0rc1.md
      - name: Install and verify fresh draft downloads before publishing the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/draft-download"
          gh release download v0.22.0rc1 --dir "$RUNNER_TEMP/draft-download"
          cd "$RUNNER_TEMP/draft-download"
          sha256sum -c SHA256SUMS
          cmp PerfectJet-v0.22.0rc1.zip "$GITHUB_WORKSPACE/releases/PerfectJet-v0.22.0rc1.zip"
          python "$GITHUB_WORKSPACE/scripts/verify_release.py" PerfectJet-v0.22.0rc1.zip
          gh release edit v0.22.0rc1 --draft=false --prerelease --latest=false
      - name: Independently verify the public candidate download and source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/public-download"
          cd "$RUNNER_TEMP/public-download"
          for file in PerfectJet-v0.22.0rc1.zip PerfectJet-v0.22.0rc1.zip.sha256 SOURCE_COMMIT.txt; do
            curl --fail --location --retry 5 --retry-all-errors --output "$file" "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.22.0rc1/$file"
          done
          sha256sum -c PerfectJet-v0.22.0rc1.zip.sha256
          cmp PerfectJet-v0.22.0rc1.zip "$GITHUB_WORKSPACE/releases/PerfectJet-v0.22.0rc1.zip"
          test "$(cat SOURCE_COMMIT.txt)" = "$CANDIDATE_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.22.0rc1 --jq .object.sha)" = "$CANDIDATE_SHA"
          python "$GITHUB_WORKSPACE/scripts/verify_release.py" PerfectJet-v0.22.0rc1.zip
